<!DOCTYPE html>
<html lang="en" xmlns="http://www.w3.org/1999/html">
<head>
    <meta charset="UTF-8"/>
    <meta content="width=device-width, initial-scale=1.0" name="viewport"/>
    <title>Starter</title>
    <!-- font-awesome -->
    <link
            href="styles.css"
            rel="stylesheet"
    />

    <!-- styles -->
    <link href="styles.css" rel="stylesheet"/>
</head>
<body>
<main>
    <section class="container">
        <!-- title !-->
        <div class="title">
            <h2>Our Reviews</h2>
            <div class="underline"></div>
        </div>
        <!-- review !-->
        <article class="review">
            <div class="img-container">
                <img alt="" id="person-img" src="./person-1.jpeg">
            </div>
            <h4 id="author">Susan smith</h4>
            <p id="job">Web developer</p>
            <p class="info"> I have been working with John Smilga tutorial<br>
                to build my own page for like 15 years.And i<br>
                still enjoy it till now.</p>
            <!-- prev next buttons -->
            <div class="button-container">
                <button class="prev-btn">
                    <i class="fas fa-chevron-right">
                        <svg class="lucide lucide-chevron-left-icon lucide-chevron-left" fill="none" height="24"
                             stroke="currentColor" stroke-linecap="round"
                             stroke-linejoin="round" stroke-width="2" viewBox="0 0 24 24" width="24"

                             xmlns="http://www.w3.org/2000/svg">
                            <path d="m15 18-6-6 6-6"/>
                        </svg>
                    </i>
                </button>

                <button class="next-btn">
                    <i class="fas fa-chevron-right">
                        <svg class="lucide lucide-chevron-right-icon lucide-chevron-right" fill="none" height="24"
                             stroke="currentColor" stroke-linecap="round"
                             stroke-linejoin="round" stroke-width="2" viewBox="0 0 24 24" width="24"
                             xmlns="http://www.w3.org/2000/svg">
                            <path d="m9 18 6-6-6-6"/>
                        </svg>
                    </i>
                </button>
            </div>
            <!-- random button-->
            <button class="random-btn">Surprise me</button>
        </article>

    </section>
</main>
<!-- javascript -->
<script src="app.js"></script>
</body>
</html>
